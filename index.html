<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI CEO Command Center</title>

  <link rel="stylesheet" href="style.css">

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@700&family=IBM+Plex+Sans:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>

<div class="app">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="logo">AI CEO</div>

    <nav class="menu">
      <div class="menu-item active">Dashboard</div>
      <div class="menu-item">Analytics</div>
      <div class="menu-item">Commands</div>
      <div class="menu-item">Reports</div>
      <div class="menu-item">Settings</div>
    </nav>
  </aside>

  <!-- Main -->
  <main class="main">

    <!-- Top bar -->
    <header class="topbar">
      <div class="title">Command Center</div>
      <div class="status">● SYSTEM ACTIVE</div>
    </header>

    <!-- Metrics -->
    <section class="metrics">
      <div class="card">
        <h3>Revenue</h3>
        <p>₹24.5L</p>
      </div>
      <div class="card">
        <h3>Growth</h3>
        <p>+18%</p>
      </div>
      <div class="card">
        <h3>Active Ops</h3>
        <p>12</p>
      </div>
      <div class="card">
        <h3>Alerts</h3>
        <p>3</p>
      </div>
    </section>

    <!-- AI Chat -->
    <section class="activity">
    <h3>System Activity</h3>
    <div class="log-box"></div>
    </section>
    <section class="chat">
      <div class="chat-box">
        <div class="message">AI: All systems stable.</div>
      </div>

      <div class="chat-input">
        <input type="text" placeholder="Enter command...">
        <button>Execute</button>
      </div>
    </section>

  </main>

</div>

<script src="script.js"></script>
</body>
</html>
